# Inverse kinematics for the arm group.
#
# KDL is the MoveIt default and it is a numerical solver: it returns whichever
# branch its seed falls into, and reports "no solution" for poses that are
# reachable in a branch it did not try. For a 6R arm with a spherical wrist
# there is a closed form with all eight branches, which is what
# cell_motion/core/kinematics.py implements and what the offline planner uses.
#
# The IKFast plugin below is the equivalent for MoveIt. Generating it needs
# OpenRAVE, which is a heavier dependency than this repository takes on, so the
# KDL settings are what ship and the difference is stated rather than hidden:
# with KDL, MoveIt will occasionally refuse a grasp pose that the offline
# planner accepts. docs/limitations.md records it.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.02
  kinematics_solver_attempts: 3
