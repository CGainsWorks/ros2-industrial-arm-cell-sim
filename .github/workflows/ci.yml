name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline job is the important one. It runs the real algorithms (the
  # closed-form IK, the collision checker, the RANSAC plane fit, the clustering,
  # the minimum-area rectangle fit, the grasp scorer, the RRT, the hand-eye
  # solve, the admittance loop, the protective stop) against the ray-traced
  # cell, with no ROS and no simulator. Then, on the same runner, it builds the
  # EtherNet/IP adapter and scanner and runs them against each other.
  offline:
    name: Offline checks and EtherNet/IP (no ROS)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # matches ROS 2 Humble's Python
          cache: pip

      - name: Install dependencies
        # From requirements.txt rather than an inline list, so this job and the
        # README's quick start cannot install different things.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        # No flags: the settings live in .flake8, so this job and `make lint`
        # cannot drift from it.
        run: flake8 src/ analysis/ tests/ simulation/ scripts/

      - name: Unit tests
        # The EtherNet/IP wire tests skip here; they run in the compose step
        # below, against the real adapter.
        run: python -m pytest tests/ -q

      - name: Generated cell description is up to date
        # cell.yaml, the world and both xacro files are generated from one table.
        # A geometry edit pushed without regenerating means the collision scene
        # the planner reasons about and the cell the simulator draws are
        # different places, which has happened, and cost a benchmark run.
        run: python simulation/generate_cell.py --check

      - name: Collision scene validation
        run: python analysis/reach_map.py --output results/reach_map.json

      - name: Grasp benchmark
        # 60 trials here rather than the 200 the README quotes: CI is a
        # regression gate, not the measurement. The confidence interval in the
        # output says how much this run is worth. The 200-trial reference run
        # is committed under docs/results/.
        run: python analysis/grasp_benchmark.py --trials 60 --output results/grasp_benchmark.json

      - name: Cycle-time breakdown
        run: python analysis/cycle_time.py --input results/grasp_benchmark.json --output results/cycle_time.json

      - name: Hand-eye calibration residual
        run: python analysis/calibration_residual.py --repeats 12 --output results/calibration.json

      - name: Inspection accuracy
        run: python analysis/inspection_accuracy.py --repeats 20 --output results/inspection.json

      - name: Controller tuning
        run: python analysis/pid_tuning.py --output results/pid_tuning.json --plots /tmp/plots

      - name: Protective stop and light curtain placement (simulated)
        # Fails if any simulated stop exceeds the stated budget, if a 14 mm
        # object can pass the curtain, or if the curtain is closer to the arm's
        # reach than ISO 13855 asks for at that budget.
        run: python analysis/safety_stop.py --cycles 10 --reach-starts 30 --output results/safety_stop.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: offline-metrics
          path: results/
          retention-days: 30

      - uses: docker/setup-buildx-action@v3

      - name: Build the EtherNet/IP image (OpENer adapter, EIPScanner client)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/enip.Dockerfile
          tags: armcell-enip:local
          load: true
          cache-from: type=gha,scope=enip
          cache-to: type=gha,scope=enip,mode=max

      - name: EtherNet/IP adapter against a scanner
        # Two containers, a PLC and a cell, on their own network: implicit I/O
        # over a Class 1 connection, explicit messaging with pycomm3, a cycle,
        # a protective stop and a lost connection.
        timeout-minutes: 10
        run: |
          docker compose -f docker/enip-compose.yml up --no-build \
            --abort-on-container-exit --exit-code-from scanner
          docker compose -f docker/enip-compose.yml down --remove-orphans

  # The ROS packages build, the launch files parse, and three things run for
  # real: MoveIt plans and executes onto ros2_control, the protective stop
  # halts the live arm, and the cell loads in Gazebo Harmonic. All headless.
  build:
    name: colcon build, live stack, launch tests (ROS 2 Humble)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container:
      image: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        # Gazebo Harmonic and its ros_gz build for Humble come from the OSRF
        # repository: Classic is end of life, and so, since September 2026, is
        # Fortress, the version Humble's own repository pairs with.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable jammy main" \
            > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep python3-pip \
            python3-numpy python3-scipy python3-yaml \
            ros-humble-moveit ros-humble-moveit-ros-move-group \
            ros-humble-moveit-planners-ompl \
            ros-humble-robot-state-publisher ros-humble-xacro \
            ros-humble-control-msgs ros-humble-tf2-ros \
            ros-humble-vision-msgs ros-humble-visualization-msgs \
            ros-humble-ros2-control ros-humble-ros2-controllers \
            ros-humble-controller-manager ros-humble-hardware-interface \
            ros-humble-joint-trajectory-controller ros-humble-joint-state-broadcaster \
            ros-humble-launch-testing-ros \
            ros-humble-ros-gzharmonic-sim gz-sim8-cli gz-transport13-cli
          pip install "pymodbus>=3.6,<3.9"
          rosdep update --rosdistro humble
          # ros_gz_sim is skipped because rosdep would resolve it to the
          # Fortress build, which conflicts with the Harmonic one above.
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys "ros_gz_sim rviz2 joint_state_publisher_gui" || true

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Xacro expands to valid URDF
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro src/cell_description/urdf/arm_cell.urdf.xacro > /tmp/arm_cell.urdf
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/arm_cell.urdf')"
          test -s /tmp/arm_cell.urdf

      - name: The stack plans, executes and refuses a collision
        shell: bash
        # A controller manager, a move_group, and a real action round trip.
        # Everything else in this job is a build, an import or a launch test,
        # and none of it would have caught an unwrapped robot_description, a
        # params file in the wrong shape, or move_group silently running CHOMP
        # instead of OMPL.
        timeout-minutes: 8
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch cell_bringup cell.launch.py use_rviz:=false auto_run:=false > /tmp/cell.log 2>&1 &
          sleep 80
          if ! python3 scripts/verify_ros_stack.py; then
            echo "::group::launch log"; tail -100 /tmp/cell.log; echo "::endgroup::"
            exit 1
          fi
          pkill -INT -f "ros2 launch" || true
          sleep 5

      - name: Launch test, protective stop on the live arm (simulated curtain)
        shell: bash
        timeout-minutes: 6
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          launch_test src/cell_safety/test/test_protective_stop.launch.py

      - name: Launch test, the cell in Gazebo Harmonic, headless
        shell: bash
        timeout-minutes: 6
        env:
          GZ_IP: 127.0.0.1
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          launch_test src/cell_bringup/test/test_gazebo_world.launch.py

      - name: Launch files import cleanly
        shell: bash
        # Catches the common failure of a launch file that only breaks at
        # runtime because of a typo'd substitution or a missing import.
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          for f in $(find src -name '*.launch.py' -not -path '*/test/*'); do
            echo "checking $f"
            python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('lf', '$f')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, 'generate_launch_description'), '$f has no generate_launch_description'
          mod.generate_launch_description()
          "
          done
